name: Production health check

# ── The watchdog that needs no credentials ───────────────────────────────────
#
# The Sentry stack (error reporting, daily triage, auto-rollback) is merged but
# dormant: every piece needs an account and API tokens only the owner can create.
# Until those exist, production had error CAPTURE but no alerting — if the site
# broke overnight, nothing would say so.
#
# This closes that gap with zero setup. It uses only GITHUB_TOKEN, which Actions
# injects automatically, so there is nothing to configure and nothing to leak.
#
# WHAT IT CAN DO: open, edit and close ONE issue. That's it.
#   • `permissions: contents: read` — it cannot touch code, branches or deploys.
#   • It never comments on a run-by-run basis while an incident is open; it EDITS
#     the existing issue instead. So a two-day outage sends you one email, not 192.
#   • Recovery closes the issue, so the issue list is an accurate "is prod ok?".
#   • Three retries per check, so a single blip is not an incident.
on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can lag under load;
    # this is a safety net, not a paging system with an SLA.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # The health check reads the hourly jobs' run history (push-catchup.yml,
  # trial-notice.yml), so a failing or stalled schedule is an incident too.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe production
        id: probe
        env:
          # Live customer cards, public URLs. Demo data can stay green while a
          # real account's card is broken — this is what closes that gap.
          # Add slugs here as accounts you care about go live.
          #
          # ⚠️ These MUST be real slugs in the CURRENT format — FirstLast-Company,
          # no hyphens inside either half (aaronlavi-malvecapital). The first pair
          # here were pre-rename slugs (aaron-lavi-malve-capital); after the slug
          # format changed they pointed at cards that no longer exist, so this
          # workflow went red on every run for weeks and kept an incident issue
          # open against a perfectly healthy production. A watchdog that cries
          # wolf gets ignored, which costs more than having no watchdog.
          #
          # Verify a slug before adding it — the card PAGE soft-404s (200 with a
          # generic shell) for an unknown slug, so only the vCard endpoint tells
          # the truth:  curl -s -o /dev/null -w '%{http_code}\n' \
          #               https://swiftcard.me/api/card/<slug>/vcard   # 200 = real
          HEALTH_REAL_CARDS: "aaronlavi-malvecapital,aaronlavi-nadlanhomesllc"
          # Reads the Supabase clock's call log, clock_status() (audit N-21;
          # supabase/clock.sql). Service-role only, read through env:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/health-check.mjs > health.json || true
          cat health.json
          {
            echo "healthy=$(node -e "console.log(require('./health.json').healthy)")"
            echo "failed=$(node -e "console.log(require('./health.json').failedCount)")"
          } >> "$GITHUB_OUTPUT"

      # Hands the same result to the Agents tab (src/lib/crew): the speed and
      # uptime agent keeps one finding per failing check. Best effort: it can
      # never fail this probe, and it's a no-op until CREW_TICK_SECRET exists.
      - name: Share the result with the Agents tab
        if: always()
        continue-on-error: true
        env:
          CREW_TICK_SECRET: ${{ secrets.CREW_TICK_SECRET }}
        run: |
          if [ -z "$CREW_TICK_SECRET" ] || [ ! -f health.json ]; then exit 0; fi
          curl -sS --max-time 20 -X POST -H "Authorization: Bearer $CREW_TICK_SECRET" -H "Content-Type: application/json" \
            --data @health.json "https://swiftcard.me/api/crew/ingest?source=health&run=${{ github.run_id }}" || true

      - name: Open, update or close the incident
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
            // Stable title = the dedupe key. One incident issue, ever.
            const TITLE = '🔴 Production health check failing';
            const { owner, repo } = context.repo;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'uptime', per_page: 20,
            });
            const existing = open.data.find((i) => i.title === TITLE);

            const table = health.results
              .map((r) => `| ${r.ok ? '✅' : '❌'} | ${r.name} | ${r.detail} | ${r.ms}ms |`)
              .join('\n');
            const body = [
              `**${health.failedCount} of ${health.checked} checks failing** against ${health.base}`,
              '',
              '| | check | detail | time |',
              '|---|---|---|---|',
              table,
              '',
              `Last checked: ${new Date().toISOString()}`,
              '',
              '<sub>Opened automatically by `.github/workflows/uptime.yml`. It edits this issue rather than commenting, so an ongoing incident does not spam you. It closes automatically when every check passes again.</sub>',
            ].join('\n');

            if (!health.healthy) {
              if (existing) {
                // EDIT, don't comment — no notification storm during a long outage.
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.notice(`Incident #${existing.number} still open — updated in place.`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title: TITLE, body, labels: ['uptime'],
                });
                core.notice(`Opened incident #${created.data.number}.`);
              }
              core.setFailed(`${health.failedCount} health check(s) failing`);
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ Recovered — all ${health.checked} checks passing as of ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.notice(`Recovered — closed incident #${existing.number}.`);
            } else {
              core.notice(`All ${health.checked} checks passing.`);
            }
