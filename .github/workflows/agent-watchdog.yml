name: "Watchdog loop (Finn · Bo · Vera · Dash + Rex's servicing watch — always on)"

# ── The always-on watch ──────────────────────────────────────────────────────
#
# OWNER ORDER (2026-09-03): the watchdogs have NO schedules. (2026-09-08: Cara,
# Lyn, Penny, Della, Ren, Dex, Dana, Ash and Pix joined the same loop.) They watch
# continuously while the office is open and their Active box is ticked, and
# only Menash stops them.
#
# This job runs a probe loop for 5h30m, then re-dispatches ITSELF, so coverage
# is continuous across GitHub's 6-hour job ceiling. The loop exits early — and
# deliberately does NOT re-arm — the moment the owner closes the office
# (Pause All), trips the auto-stop, or unticks the last watchdog's Active box.
# That is the only thing that stops the watch.
#
# Re-dispatching with GITHUB_TOKEN works because workflow_dispatch is one of
# the two documented exceptions to "a GITHUB_TOKEN event cannot start another
# workflow run" (the other being repository_dispatch). No PAT needed.
#
# The hourly cron is a BACKSTOP, not the clock: if a runner dies mid-loop, the
# next tick restarts the watch. `concurrency` guarantees only one loop is ever
# live, so a backstop firing while the loop is healthy is a no-op.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | wake | rearm | backstop"
        required: false
        default: "manual"
  schedule:
    - cron: "7 * * * *"

permissions:
  actions: write
  contents: read

# One loop, ever. A second dispatch while the first is alive is dropped rather
# than queued — two loops would double-report every finding.
concurrency:
  group: agent-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 5h50m hard stop, just under GitHub's 6h kill, so the re-arm step below
    # always gets to run instead of the job being killed mid-flight.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Watch continuously
        id: loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Probe cadence. This is the DETECTION interval (plain HTTP, no
          # tokens) — not an agent cadence. 60s means a broken checkout is
          # noticed within a minute.
          WATCHDOG_TICK_SEC: "60"
          WATCHDOG_BUDGET_MIN: "330"
          # Bo reads Vercel runtime errors when these exist; without them he
          # reports nothing rather than inventing calm. Add them as repo
          # secrets to switch him on.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Dana's RLS probe needs the PUBLIC anon key (it is public by design).
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The Radar's optional eyes (lib/radar.mjs). Without them: Reddit
          # reads the public feed (rate-limited), Telegram reads public
          # channels only, YouTube stays off — each source row says so.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          node marketing-agents/watchdog.mjs | tee watchdog.log
          # The loop prints WATCHDOG_REARM=yes|no as its last line.
          echo "rearm=$(grep -oE 'WATCHDOG_REARM=(yes|no)' watchdog.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Re-arm the watch
        # Only when the loop hit its time budget. If the owner stood it down,
        # this is skipped and the watch stays off until he turns it back on.
        if: steps.loop.outputs.rearm == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run agent-watchdog.yml --ref main -f trigger=rearm
          echo "Watch re-armed — the next loop takes over."

      - name: Report a stand-down
        if: steps.loop.outputs.rearm == 'no'
        run: echo "::notice::Owner stood the watch down (office closed, auto-stop, or no Active watchdog). Not re-arming."
