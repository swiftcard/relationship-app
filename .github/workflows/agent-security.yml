name: "Agent: security"
# Manually triggered (workflow_dispatch). Writes only to agent_* tables
# (and, for blog in auto mode, the agent_blog_posts table). No git, no gh, no
# deploys, no platform APIs.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | schedule"
        default: "manual"
concurrency:
  group: agent-security
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Run agent
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node marketing-agents/agent-security.mjs
