name: Crew tick (agents clock)

# ── The clock for the agent system (Agents tab, src/lib/crew) ────────────────
#
# Every 15 minutes this calls POST /api/crew/tick with Bearer CREW_TICK_SECRET.
# The tick runs whichever agents are switched on, set up and due, and stops
# itself after ~4 minutes. The model keys live only in Vercel; this workflow
# holds nothing but the shared tick secret.
#
# WHAT IT CAN DO: call one endpoint, and open/edit/close ONE issue (label
# `crew`) when the tick keeps failing. It cannot touch code or deploys.
#
# Until CREW_TICK_SECRET exists as a repo secret it exits quietly (green), so a
# fresh setup never opens an incident.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: crew-tick
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the tick
        id: tick
        env:
          CREW_TICK_SECRET: ${{ secrets.CREW_TICK_SECRET }}
          BASE: https://swiftcard.me
        run: |
          if [ -z "$CREW_TICK_SECRET" ]; then
            echo "CREW_TICK_SECRET is not set yet; nothing to do."
            echo "status=unconfigured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o tick.json -w '%{http_code}' --max-time 320 -X POST \
            -H "Authorization: Bearer $CREW_TICK_SECRET" "$BASE/api/crew/tick" || echo 000)
          cat tick.json 2>/dev/null || true
          echo
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "status=failed" >> "$GITHUB_OUTPUT"; fi

      - name: Open, update or close the incident
        if: steps.tick.outputs.status != 'unconfigured'
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.tick.outputs.status }}
          CODE: ${{ steps.tick.outputs.code }}
        with:
          script: |
            const TITLE = '🤖 Agents clock (crew tick) failing';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'crew', per_page: 20 });
            const existing = open.data.find((i) => i.title === TITLE);
            const failed = process.env.STATUS !== 'ok';
            const body = [
              `The agents' 15-minute tick answered **HTTP ${process.env.CODE}**.`,
              '',
              `Last checked: ${new Date().toISOString()} ([run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}))`,
              '',
              '<sub>Opened by `.github/workflows/crew-tick.yml`. It edits this issue instead of commenting, and closes it when the tick works again.</sub>',
            ].join('\n');
            if (failed) {
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['crew'] });
              core.setFailed(`crew tick answered ${process.env.CODE}`);
              return;
            }
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `✅ Working again as of ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
