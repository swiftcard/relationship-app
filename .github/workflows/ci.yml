name: CI

# Runs on every push and PR. These checks need no secrets/env, so they run
# reliably, and they are the GATE: Vercel Deployment Checks hold every
# production build until the `verify` and `render` jobs below pass (since
# 2026-10-09). Vercel matches them BY JOB NAME, so renaming either one means
# updating the checks in Vercel's project settings too
# (tests/deploy-gate.test.ts). `verify` runs:
#   • typecheck — the compiler catches broken types across the whole app
#   • lint      — eslint catches unused code, bad hooks, banned patterns
#   • test      — 680+ source-invariant + logic tests (kept GREEN, so any red is real)
#
# A red run means the push is NOT live: swiftcard.me keeps the last green
# build until a fix makes CI pass again.
#
# The repo is PUBLIC (since 2026-10-22), which is what makes GitHub-hosted
# minutes free, macOS included. Never point a job here at a self-hosted runner:
# this workflow runs on pull_request, and on a public repo anyone can open a
# PR that rewrites it and runs their code on that machine.

on:
  push:
    branches: [main]
  pull_request:

# On a PR branch, a newer push cancels the older in-flight run (only the
# newest commit can be merged). On main it must NOT: these runs are the gate
# Vercel waits on, and render takes 20 to 30 minutes, so with pushes landing
# more often than that every run was cancelled before it finished and nothing
# reached production (Nov 4 2026: b9f898ff, f646b5c8, 976c83d6, b5e02e77 all
# cancelled while swiftcard.me stayed on 7d993ccd). Now a main run in progress
# always finishes and that commit goes live; GitHub keeps only the newest
# waiting run behind it, so the queue never grows and the next run is the
# latest main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Test
        run: npx vitest run

      # The net for a machine whose git hooks are not installed (another clone,
      # a CI-less tool). A commit built on an out-of-date copy can put an older
      # version of a file back over a newer one with no error from anything above
      # (087c4cc3, 2026-10-20: six files, the push fixes). Last on purpose: it
      # needs history, and deepening the clone HERE rather than at checkout keeps
      # every step above running on exactly the checkout it always ran on. It
      # passes with a warning if it cannot read the range; it only fails on a real
      # finding. scripts/revert-guard.mjs says how to mark a deliberate revert.
      - name: No older file version silently put back
        env:
          RANGE_FROM: ${{ github.event.before || github.event.pull_request.base.sha }}
          RANGE_TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --prune --deepen=500 origin || true
          node scripts/revert-guard.mjs --ci

  # ── The suite that measures a real browser ──────────────────────────────────
  #
  # `npm test` is 2700 source-invariant and logic tests, and not one of them can
  # see a word being cut off or a control drawn under something else: overflow
  # is string length x font metrics x container width, none of which exist until
  # something is laid out. tests/render/ renders the card templates and key
  # screens in headless Chromium with the app's real compiled Tailwind and
  # measures them.
  #
  # It was already written and already green — it just was not running anywhere,
  # so the only thing that caught this class was paint-check.yml, which runs
  # AFTER production deploys. Same signal, ~2 minutes earlier, on the PR.
  #
  # Separate job so a Chromium download never slows the fast checks, and so a
  # red render suite names itself in the checks list.
  render:
    # macOS, not ubuntu, and it costs more minutes on purpose.
    #
    # These tests MEASURE text: "does this company name fit", "does the contact
    # row overflow at 375px". The app ships Geist (next/font/google, fetched at
    # build time into .next/static/media under a hashed name), so a Linux runner
    # falls back to DejaVu and measures a font the product never uses. The first
    # CI run proved it — portal-phone-fit reported a 12px overflow and
    # signup-nudge a clipped line that neither shows on a machine with the real
    # font. Testing a fiction is worse than not testing.
    #
    # If the minutes ever matter more than the signal, move this back to
    # ubuntu-latest and accept that the pixel-exact tests are advisory there.
    runs-on: macos-latest
    # The tests alone took 15-23 minutes in late Oct - early Nov 2026, so 25
    # cut off passing runs on slow runners (63924079, twice, with no failure).
    # 40 still fits inside wait-for-live's 45-minute window.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WebKit too: the iPhone app and Safari are WebKit, and a card layout that
      # was clean in Chromium squeezed every row in WebKit (owner, 2026-10-05) —
      # tests/render/card-rows-iphone-engine.test.ts measures the cards in both.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Render tests
        run: npm run test:render
