name: Paint check (invisible content)

# ── The check that would have caught the invisible SwiftLink preview ─────────
#
# Every other automated check reads the SERVER's HTML. That is why a live
# preview could render into a 0x0 box for ~12 days while uptime stayed green,
# 926 tests passed, and the SSR markup contained every string those checks look
# for: the failure only exists after JavaScript lays the page out in a browser.
#
# This runs a real rendering browser against the deploy that just went live and
# fails when something is present-but-invisible: a collapsed CardScaler, a
# preview frame with no size, an unresolved Suspense stub, a broken image, or a
# homepage mini-builder whose preview does not react to typed input.
#
# Read-only. It browses like a visitor: no account, no card writes, no mail.
# Runs AFTER the deploy (never blocks shipping) and opens an issue if it finds
# anything, because the point is to be told rather than to discover it by eye.

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: paint-check
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  paint:
    # deployment_status also fires for previews and for every state transition.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sweep production for invisible content
        id: sweep
        run: |
          set -o pipefail
          node scripts/site-invisible-sweep.mjs 2>&1 | tee sweep.log

      - name: Open an issue when something is invisible
        if: failure() && steps.sweep.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            printf '**Commit:** `%s`\n\n' "${SHA:0:7}"
            printf 'Something on the live site is rendering but not visible. This is the\n'
            printf 'failure mode that hid the SwiftLink live preview for ~12 days — the HTML\n'
            printf 'is correct, so only a real browser can see it.\n\n'
            printf '```\n'
            cat sweep.log
            printf '\n```\n\n'
            printf 'Reproduce locally: `node scripts/site-invisible-sweep.mjs`\n\n'
            printf '🤖 Opened by the paint check.\n'
          } > body.md
          # ONE open issue at a time. Until 2026-09-28 every failing deploy
          # opened a fresh issue and nothing ever closed one, so 29 stale
          # "Invisible content" issues from August sat open against a site
          # that had been painting fine for seven weeks — and the list stopped
          # meaning anything. Now: an open one gets a comment, else create.
          existing=$(gh issue list --state open --search '"Invisible content on production" in:title' \
            --json number,title --limit 50 \
            | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const i=l.find(i=>i.title.startsWith("🫥 Invisible content on production"));if(i)console.log(i.number)')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Still failing — commented on #$existing"
          else
            gh issue create --title "🫥 Invisible content on production after ${SHA:0:7}" \
              --body-file body.md --label "production,watchdog" \
              || gh issue create --title "🫥 Invisible content on production after ${SHA:0:7}" --body-file body.md
          fi

      - name: Close the invisible-content issues once the site paints again
        if: steps.sweep.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          set -euo pipefail
          gh issue list --state open --search '"Invisible content on production" in:title' \
            --json number,title --limit 100 \
            | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const i of l)if(i.title.startsWith("🫥 Invisible content on production"))console.log(i.number)' \
            | while read -r n; do
                gh issue close "$n" --comment "✅ Recovered — the paint check passed on \`${SHA:0:7}\`; nothing on the live site is invisible. Closed automatically by \`.github/workflows/paint-check.yml\`."
                echo "Closed #$n"
              done
