name: Crew render (social post pictures)

# ── Draws the pictures for the Agents tab's social media manager ─────────────
#
# Dispatched by src/lib/crew/agents/social.ts. Reads the post's spec from
# /api/crew/ingest, draws the slides with Playwright in the launch posts'
# visual system (scripts/crew-render-social.mjs), stores the PNGs in our own
# Supabase storage bucket `crew-media` (created by supabase/crew.sql), and
# posts the links back. It publishes NOTHING: a person picks an option and
# posts the finished set from our accounts.
#
# The spec is model-written text, so it is treated as data: it never reaches a
# shell line, and the HTML builder escapes every string.
on:
  workflow_dispatch:
    inputs:
      spec_id:
        description: "Social post id"
        required: true
      step:
        description: "options or final"
        required: true

concurrency:
  group: crew-render-${{ inputs.spec_id }}-${{ inputs.step }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright only
        run: |
          npm install --no-save --no-audit --no-fund playwright@$(node -p "require('./package.json').dependencies.playwright.replace(/^[^0-9]*/, '')")
          npx playwright install --with-deps chromium

      - name: Fetch the spec
        env:
          CREW_TICK_SECRET: ${{ secrets.CREW_TICK_SECRET }}
          SPEC_ID: ${{ inputs.spec_id }}
          STEP: ${{ inputs.step }}
        run: |
          [[ "$SPEC_ID" =~ ^[0-9a-z-]{8,40}$ ]] || { echo "bad id"; exit 1; }
          [[ "$STEP" == "options" || "$STEP" == "final" ]] || { echo "bad step"; exit 1; }
          curl -sSf --max-time 30 -H "Authorization: Bearer $CREW_TICK_SECRET" "https://swiftcard.me/api/crew/ingest?social_spec=$SPEC_ID" -o spec.json

      - name: Draw
        env:
          STEP: ${{ inputs.step }}
        run: node scripts/crew-render-social.mjs spec.json "$STEP" out

      - name: Store the pictures and post the links back
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREW_TICK_SECRET: ${{ secrets.CREW_TICK_SECRET }}
          SPEC_ID: ${{ inputs.spec_id }}
          STEP: ${{ inputs.step }}
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const { SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY: key, SPEC_ID, STEP, CREW_TICK_SECRET } = process.env;
          const base = SUPABASE_URL.replace(/\/$/, "");
          const files = [];
          for (const f of JSON.parse(fs.readFileSync("out/files.json", "utf8"))) {
            const path = `social/${SPEC_ID}/${STEP}-${f.key}.png`;
            const r = await fetch(`${base}/storage/v1/object/crew-media/${path}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${key}`, "Content-Type": "image/png", "x-upsert": "true" },
              body: fs.readFileSync(f.file),
            });
            if (!r.ok) throw new Error(`upload ${path}: HTTP ${r.status}`);
            files.push({ key: f.key, url: `${base}/storage/v1/object/public/crew-media/${path}` });
          }
          const r = await fetch("https://swiftcard.me/api/crew/ingest?source=social", {
            method: "POST",
            headers: { Authorization: `Bearer ${CREW_TICK_SECRET}`, "Content-Type": "application/json" },
            body: JSON.stringify({ spec_id: SPEC_ID, step: STEP, files }),
          });
          console.log("posted back", r.status, files.length);
          '
