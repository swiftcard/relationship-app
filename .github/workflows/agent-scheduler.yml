name: "Agent scheduler (inert until a schedule is set)"
# The ONLY clock in the system, and it dispatches NOTHING by default: it reads
# agent_settings.schedule from the DB (set in the DB; NULL for
# every agent out of the box) and triggers agents whose cron matches this
# half-hour. With no schedules set — the default — every run is a no-op.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Dispatch due agents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node marketing-agents/scheduler.mjs
